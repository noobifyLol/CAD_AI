e between Hawaii and anywhere in North America with the ease and convenience of a single carrier, including single invoicing. We provide dedicated support from our Los Angeles, CA service center for all your Hawaii shipping needs including door-to-door tracking, Hazmat, and Ocean DOT regulations. We offer multiple weekly sailings to six Hawaiian Islands and final delivery within 48 hours upon arrival at the destination island.&lt;/p&gt;&quot;, &quot;description&quot;: &quot;&quot;, &quot;slug&quot;: &quot;&quot;, &quot;hideButton&quot;: false, &quot;image&quot;: {&quot;src&quot;: &quot;&quot;, &quot;altText&quot;: &quot;&quot;, &quot;titleText&quot;: &quot;&quot;}, &quot;image2&quot;: {&quot;src&quot;: &quot;&quot;, &quot;altText&quot;: &quot;&quot;, &quot;titleText&quot;: &quot;&quot;}, &quot;button&quot;: {&quot;label&quot;: &quot;View Hawaii LTL shipping FAQs&quot;, &quot;href&quot;: &quot;/help-center/faqs-freight-shipping-hawaii/&quot;, &quot;target&quot;: &quot;&quot;}}, {&quot;title&quot;: &quot;Puerto Rico&quot;, &quot;subtitle&quot;: &quot;&quot;, &quot;copy&quot;: &quot;&lt;p&gt;Our on-site service center in San Juan provides an advantage with priority loading and unloading service of your LTL shipments at the port &amp;ndash; which results in a transit savings of 1-2 days. We offer multiple weekly sailings from Jacksonville, FL to San Juan, PR &amp;ndash; no customs or freight forwarders needed. Our 24 hour bilingual Customs Resource Center experts are ready to help you with paperwork filing, shipment tracking and booking your shipments.&lt;/p&gt;&quot;, &quot;description&quot;: &quot;&quot;, &quot;slug&quot;: &quot;&quot;, &quot;hideButton&quot;: false, &quot;image&quot;: {&quot;src&quot;: &quot;&quot;, &quot;altText&quot;: &quot;&quot;, &quot;titleText&quot;: &quot;&quot;}, &quot;image2&quot;: {&quot;src&quot;: &quot;&quot;, &quot;altText&quot;: &quot;&quot;, &quot;titleText&quot;: &quot;&quot;}, &quot;button&quot;: {&quot;label&quot;: &quot;View Puerto Rico LTL shipping FAQs&quot;, &quot;href&quot;: &quot;/help-center/faqs-shipping-puerto-rico-us/&quot;, &quot;target&quot;: &quot;&quot;}}], &quot;content&quot;: &quot;tabs-component-5&quot;, &quot;label&quot;: &quot;USA&quot;}, {&quot;id&quot;: 6, &quot;cards&quot;: [{&quot;title&quot;: &quot;Canada&quot;, &quot;subtitle&quot;: &quot;&quot;, &quot;copy&quot;: &quot;&lt;p&gt;Our Canada cross-border service delivers reliable, secure shipping between the U.S. and Canada, backed by four decades of experience and a company-operated network you can trust. With 12 Canadian service centers, nine border crossings to accelerate transit times&amp;nbsp;and coverage reaching 99% of&amp;nbsp;postal&amp;nbsp;codes, we provide consistent, end-to-end execution. &lt;a href=\&quot;https://www.xpo.com/help-center/canada/customs-resource-center/\&quot;&gt;Streamlined customs clearance&lt;/a&gt;, coordinated broker support&amp;nbsp;and handling by XPO employees using company-owned equipment help reduce delays and costs. Add in strong clearance performance, competitive transit&amp;nbsp;times&amp;nbsp;and guaranteed service options for time-sensitive shipments, and you get a solution built for speed,&amp;nbsp;control&amp;nbsp;and confidence.&lt;/p&gt;&quot;, &quot;description&quot;: &quot;&quot;, &quot;slug&quot;: &quot;&quot;, &quot;hideButton&quot;: false, &quot;image&quot;: {&quot;src&quot;: &quot;&quot;, &quot;altText&quot;: &quot;&quot;, &quot;titleText&quot;: &quot;&quot;}, &quot;image2&quot;: {&quot;src&quot;: &quot;&quot;, &quot;altText&quot;: &quot;&quot;, &quot;titleText&quot;: &quot;&quot;}, &quot;button&quot;: {&quot;label&quot;: &quot;Get reliable LTL shipping to and from Canada&quot;, &quot;href&quot;: &quot;https://www.xpo.com/offerings/geographic-coverage/canada/&quot;, &quot;target&quot;: &quot;&quot;}}], &quot;content&quot;: &quot;tabs-component-6&quot;, &quot;label&quot;: &quot;Canada&quot;}, {&quot;id&quot;: 39, &quot;cards&quot;: [{&quot;title&quot;: &quot;Mexico&quo
